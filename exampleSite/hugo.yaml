baseURL: 'https://scropion86.github.io/'
languageCode: 'en-US'
title: 'Edge & Logic Blog'
theme: 'kopi'
params:
  subtitle: 'I enjoy understanding how systems actually work—then building, automating, and sometimes breaking them to make them better. This blog covers APIs, backend systems, cloud infrastructure, automation workflows, and self-hosted tools. You’ll also find experiments, debugging notes, and real-world engineering patterns from things I actually work on. The goal is simple: turn complexity into something usable.'
  author:
    name: "Mohammed Lotfy"
    bio: "I enjoy understanding how systems actually work—then building, automating, and sometimes breaking them to make them better. This blog covers APIs, backend systems, cloud infrastructure, automation workflows, and self-hosted tools. You’ll also find experiments, debugging notes, and real-world engineering patterns from things I actually work on. The goal is simple: turn complexity into something usable."
    link: "/about"
    role: "Owner"

menus:
  main:
    - name: 'Home'
      pageRef: '/'
      weight: 10
    - name: 'Topics'
      identifier: 'topics'
      url: '#'
      weight: 20
    #- name: 'Hugo'
    #  parent: 'topics'
    #  pageRef: '/hugo'
    #  weight: 10
    - name: 'About'
      url: '#'
      weight: 30

module:
  hugoVersion:
    extended: true
    min: '0.146.0'

markup:
  goldmark:
    renderer:
      unsafe: true

mediaTypes:
  application/radio+json:
    suffixes:
      - json

outputFormats:
  RADIO:
    mediaType: application/radio+json
    baseName: radio
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    #- RADIO
